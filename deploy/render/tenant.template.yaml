# One venue business's own copy of the booking site, on Render.
#
# Do not use this file directly. Run
#
#   npm run new-tenant -- <slug> "<Site Name>"
#
# which writes deploy/render/<slug>.yaml from it, then commit that file and in
# Render choose New → Blueprint, pick this repository, and set the Blueprint
# path to deploy/render/<slug>.yaml. Each tenant has its own file because a
# Blueprint applies itself to any existing service with the same name: two
# tenants sharing one file would be one service, overwritten.
databases:
  # The tenant's own Postgres. The smallest paid plan: the free one is deleted
  # after 30 days. Reachable only from Render's private network.
  - name: __SERVICE__-db
    plan: basic-256mb
    region: singapore
    databaseName: mysenam
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: __SERVICE__
    runtime: node
    # The 0.5 CPU / 512 MB instance. A disk needs a paid instance.
    plan: __PLAN__
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # The nightly backups are written here before they are copied off-site.
    # (Render Postgres keeps its own daily backups too.)
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_NAME
        value: "__SITE_NAME__"
      - key: DATABASE_URL
        fromDatabase:
          name: __SERVICE__-db
          property: connectionString
      - key: MYSENAM_DATA_DIR
        value: /var/data
      - key: MYSENAM_BACKUP_DIR
        value: /var/data/backups
      # Kept in Render rather than on the disk, so payment keys still unlock
      # after the database is restored somewhere else.
      - key: MYSENAM_SECRET
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MYSENAM_URL
        sync: false
      # Optional: fill in later under Environment.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OFFSITE_S3_ENDPOINT
        sync: false
      - key: OFFSITE_S3_BUCKET
        sync: false
      - key: OFFSITE_S3_ACCESS_KEY_ID
        sync: false
      - key: OFFSITE_S3_SECRET_ACCESS_KEY
        sync: false
