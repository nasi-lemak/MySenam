# Postgres sized for sharing a 2 GB Droplet with the app. Installed to
# /etc/postgresql/16/main/conf.d/mysenam.conf by setup.sh.
#
# The app takes about 250 MB and Caddy a few tens; this leaves Postgres a
# quarter of the machine for its own cache and the rest to the operating
# system's, which Postgres leans on too. On a 4 GB Droplet, double
# shared_buffers and effective_cache_size.

# Only the app, on this machine. (The default; said here so nobody "fixes" it.)
listen_addresses = 'localhost'

# The app holds a pool of 10; the rest is room for psql, pg_dump and a deploy
# that starts the new app before the old one has let go.
max_connections = 40

# A restore (scripts/restore.mjs) loads a backup in one transaction, which
# locks every table, index and sequence it creates: several hundred, growing
# with the schema. The default (64 per connection, about 3,900 slots here)
# leaves less room each release; 256 is a few MB of shared memory and keeps a
# restore well clear of "out of shared memory".
max_locks_per_transaction = 256

shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB

# On an SSD, random reads cost little more than sequential ones.
random_page_cost = 1.1
effective_io_concurrency = 200

# Fewer, larger checkpoints: less disk churn for a write load this size.
checkpoint_completion_target = 0.9
max_wal_size = 1GB

# Anything slower than half a second is worth seeing in the log.
log_min_duration_statement = 500
