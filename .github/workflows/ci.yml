name: CI

# Runs where a result is worth paying for: on pull requests, and on pushes
# to the branch the demo deploys from. Not on every branch an agent pushes
# to along the way — each run tests twice and takes minutes from the
# account's monthly allowance, and those branches get checked again when
# they come back as a pull request.
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main, claude/sports-court-booking-w99x22]
    paths-ignore: ["**/*.md"]
  # Run it by hand from the Actions tab, on any branch, when wanted.
  workflow_dispatch:

# Several pushes in a row test only the last: a newer push cancels the run
# still going for the one before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung run stops here instead of burning the default six hours.
    timeout-minutes: 30
    # The suite runs twice: on PGlite, as a developer runs it, and against a
    # real Postgres server, as production runs — where requests really do run
    # side by side on separate connections.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (PGlite)
        run: npm test

      - name: Test (Postgres 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npm run build

      # The production build, driven by a real browser (tests/e2e).
      - name: Install Chromium for the end-to-end tests
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
