name: CI

# MANUAL ONLY. Release verification is run on the AI development VM, not here:
#   node scripts/verify.mjs release --pg docker      (see docs/development/testing.md)
# GitHub Actions bills by the minute, and this job (the suite twice, the build,
# the browser tests) takes about half an hour, so nothing starts it
# automatically: not a push to any branch, not a pull request. Run it by hand
# from the Actions tab only when the AI VM cannot be used. It is not a required
# check for merging and must not be made one.
on:
  workflow_dispatch:

jobs:
  ci:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from October 2026, and the
    # browser install and Postgres service are only known to work on this one.
    runs-on: ubuntu-24.04
    # A hung run stops here instead of burning the default six hours.
    timeout-minutes: 30
    # The suite runs twice: on PGlite, as a developer runs it, and against a
    # real Postgres server, as production runs — where requests really do run
    # side by side on separate connections.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser for the end-to-end tests, before the checks that need it.
      - name: Install Chromium for the end-to-end tests
        run: npx playwright-core install --with-deps chromium

      # The same checks, in the same order, as anybody runs them by hand or on a
      # staging machine: typecheck, lint, docs, the suite on PGlite and on this
      # job's Postgres, the build and the browser tests (scripts/verify.mjs).
      - name: Verify
        run: node scripts/verify.mjs release --pg docker --report artifacts/verify/ci.json
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: artifacts/verify/
