name: Docs

# MANUAL ONLY, like ci.yml: the documentation checks (tests/docs.test.ts) run on
# the AI development VM as part of `node scripts/verify.mjs release`, and by hand
# with `npm run docs:check`. They take seconds, but each run still costs a
# billed minute and an install, so nothing starts them automatically.
on:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation references
        run: npm run docs:check
